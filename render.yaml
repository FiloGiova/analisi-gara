# Blueprint Render per FischioLab (backend Express + SPA, DB/Storage su Supabase).
# Su render.com: New → Blueprint → collega il repo FiloGiova/analisi-gara.
# I valori marcati `sync: false` NON stanno nel repo: si inseriscono nella
# dashboard Render (Environment) — sono gli stessi del .env locale.
services:
  - type: web
    name: fischiolab
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # --include=dev serve per vite (build) anche con NODE_ENV=production.
    # NON usare --omit=optional: rollup distribuisce i suoi binari per-piattaforma
    # come optionalDependencies e servono a Vite. better-sqlite3 è anch'esso
    # optional: su Node 22 usa un binario precompilato, e se fallisse è non-fatale.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_BASE_URL
        value: https://fischiolab.onrender.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ENABLE_GOOGLE_AUTH
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # I documenti pubblici usano i dati versionati in src/publicInformation.js.
      # Eventuali override PUBLIC_* si possono aggiungere da Environment.
      - key: DATABASE_SSL
        value: "true"
      - key: STORAGE_BUCKET
        value: rapporti
      - key: ENABLE_SCHEDULED_SYNC
        value: "true"
      - key: SCHEDULED_SYNC_TIME
        value: "13:15"
      - key: SCHEDULED_SYNC_TIMEZONE
        value: Europe/Rome
      # FIP Analytics: credenziali dell'account designatore, da impostare a mano.
      - key: FIP_ANALYTICS_USERNAME
        sync: false
      - key: FIP_ANALYTICS_PASSWORD
        sync: false
      - key: FIP_ANALYTICS_SYNC_TIMES
        value: "11:00,21:00"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Email agli arbitri (opzionali). ATTENZIONE: il piano Free di Render
      # blocca le porte SMTP in uscita (25/465/587) — l'invio funziona solo
      # su istanze a pagamento (Starter o superiori).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Opzionali (AI giudizio globale).
      - key: ENABLE_AI_FEATURES
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
